<!DOCTYPE html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="My flutter portfolio!" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta
      name="apple-mobile-web-app-title"
      content="Jeppe Porsing - A Portfolio"
    />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Jeppe Porsing - Portfolio</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
    <script>
      function launchFlutter() {
        _flutter.load.loadEntrypoint({
          serviceWorker: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function (engineInitializer) {
            engineInitializer.initializeEngine().then(function (appRunner) {
              appRunner.runApp();
            });
          },
        });
      }

      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          const timestamp = new Date().getTime();
          const xmlhttp = new XMLHttpRequest();
          xmlhttp.open("GET", `/version.json?v=${timestamp}`, true);
          xmlhttp.addEventListener("load", function () {
            const buildNumber = xmlhttp.responseText.trim();
            const currentBuildNumber = localStorage.getItem("buildNumber");
            if (currentBuildNumber !== buildNumber) {
              console.log("Clearing outdated caches...");
              caches
                .keys()
                .then((keys) => keys.forEach((key) => caches.delete(key)));
              localStorage.setItem("buildNumber", buildNumber);
            }
            launchFlutter();
          });

          xmlhttp.addEventListener("error", launchFlutter);
          xmlhttp.addEventListener("abort", launchFlutter);
          xmlhttp.addEventListener("timeout", launchFlutter);
          xmlhttp.send();
        } else {
          console.log("Service Worker not supported.");
          launchFlutter();
        }
      });
    </script>
  </body>
</html>
